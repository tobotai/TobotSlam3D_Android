plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tobot.slam3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.tobot.slam3d"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // 只保留 arm 架构（与底盘配套的平板/手机一致）
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // 中英两套 strings 故意不完全对齐，不因此阻断构建
        disable 'MissingTranslation'
        abortOnError false
    }

    // 刻意不做 APK 改名（applicationVariants.outputs.outputFileName 在 AGP 8 上已废弃，
    // 容易因版本差异导致构建失败）。产物就是默认的 app-debug.apk / app-release.apk。
}

dependencies {
    // 极简依赖：不引用任何厂商闭源 jar，3D 协议全部走标准 rosbridge WebSocket
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
